# Human toolset and machine setup — this mac laptop and any user-facing Linux box.
# Headless agent runner pods do NOT get these; they get the agent repo's mise.toml
# and nothing else.
#
# This checkout lives at ~/.config/mise, so `mise use -g` and `mise up` write
# straight back into the repository.
# The agent-functional toolset is loaded as mise's lower-precedence system config
# from `~/dev/agent/mise.toml` (MISE_SYSTEM_CONFIG_FILE, exported by .zshenv), so
# human `[tools]` entries override the agent's (e.g. node) and human `[settings]`
# win.
#
# `mise bootstrap` is the whole installer: packages, repos, dotfiles, and services.
# `cza` runs it. A brand-new host needs two runs: the first clones ~/dev/agent,
# and the second loads that system config and installs the agent harness.

# Git identity for ~/.gitconfig. Override per machine with GIT_AUTHOR_NAME /
# GIT_AUTHOR_EMAIL; otherwise these portable defaults apply.
[vars]
git_name = "{{ get_env(name='GIT_AUTHOR_NAME', default='Oisin Coveney') }}"
git_email = "{{ get_env(name='GIT_AUTHOR_EMAIL', default='git@oisin.ee') }}"

[tools]
# ── override of an agent tool ──
node = "lts" # laptop tracks LTS; the agent repo pins node=latest for birth-seeding

# ── core replacements (shell UX) ──
"cargo:eza" = "latest"
bat = "latest"
fzf = "latest"
zoxide = "latest"
starship = "latest"
atuin = "latest"
delta = "latest"
# ── zen TUIs ──
yazi = "latest"
lazygit = "latest"
lazydocker = "latest"
television = "latest"
"github:Canop/broot" = "latest"
mprocs = "latest"               # run parallel procs in split panes
# ── modern-unix drop-ins ──
dust = "latest"
duf = "latest"
"aqua:dalance/procs" = "latest"
sd = "latest"
choose = "latest"
hyperfine = "latest"
tokei = "latest"
# ── charm + fetch (the sexy) ──
fastfetch = "latest"
"aqua:o2sh/onefetch" = "latest"
glow = "latest"
gum = "latest"
# ── data / http / net (interactive viewers) ──
xh = "latest"
jless = "latest"
"github:mr-karan/doggo" = "latest"
gping = "latest"
# ── shell UX ──
carapace = "latest"
"cargo:tealdeer" = "latest"     # builds a binary named `tldr`
"cargo:navi" = "latest"
"cargo:pay-respects" = "latest"
# ── notes + LLM REPL ──
"aqua:zk-org/zk" = "latest"      # plain-text zettelkasten/notes CLI (zk-org maintained fork)
"aqua:sigoden/aichat" = "latest" # all-in-one LLM CLI: REPL, shell-assistant, RAG, agents
# ── logs ──
"github:tstack/lnav" = "latest" # log viewer with SQL queries over log files
# ── HTTP + DB TUIs (CLI half of the GUI dbeaver/tableplus/posting workflow) ──
"pipx:posting" = "latest" # terminal HTTP client — Postman/Insomnia in a TUI (darrenburns)
# pgcli's psycopg dep uses the system libpq on non-Windows; inject psycopg[binary]
# so it ships the libpq-bundled wheel and is self-contained on mac + Linux.
"pipx:pgcli" = { version = "latest", uvx_args = "--with psycopg[binary]" } # Postgres CLI: autocompletion + syntax highlight (dbcli)
"pipx:litecli" = "latest"                                                  # SQLite CLI (dbcli)
"pipx:mycli" = "latest"                                                    # MySQL/MariaDB CLI (dbcli)

# ── portable human CLIs a user-facing Linux box needs through mise. Only tools
#    with a maintained mise/aqua backend live here; the rest are Homebrew
#    formulae in [bootstrap.packages].
# editors / docs / markup
neovim = "latest"
pandoc = "latest"
typst = "latest"
svgo = "latest"
# git / secrets / certs
git-filter-repo = "latest"
age = "latest"
mkcert = "latest"
# CI / build / net
act = "latest"        # run GitHub Actions locally
actionlint = "latest" # lint GitHub Actions workflows
websocat = "latest"   # WebSocket client
protobuf = "latest"   # protoc
# infra / platform CLIs (dev-facing; agents' k8s kit lives in the agent file)
argocd = "latest"
crane = "latest"    # container registry client
k3d = "latest"      # local k3s in Docker
kubeseal = "latest" # sealed-secrets client
flyctl = "latest"
coder = "latest"
okteto = "latest"
openbao = "latest"  # `bao`
neonctl = "latest"
"npm:@moonshot-ai/kimi-code" = "0.29.0"
dotnet = "9"
"npm:oxlint-tsgolint" = "7.0.2001"
"npm:@getpaseo/cli" = "latest"
supabase = "2.95.5"
postgres = "17"
# `mas` backs the [bootstrap.packages] "mas:" entries below.
mas = "latest"

[settings]
idiomatic_version_file_enable_tools = []
# Private github: backends (e.g. oisin-ee/yeet) resolve their token through git's
# existing gh credential helper (~/.gitconfig already sets gh auth git-credential).
github.use_git_credentials = true
# Keep readable latest/lts policy here while mise records exact resolved versions and
# checksums in the tracked global mise.lock.
lockfile = true
trusted_config_paths = ["/Users/oisin/dev"]
# Explicit source paths below resolve relative to this configuration file.

# ── Repositories cloned before dotfiles are applied. The agent harness checkout
#    is MISE_SYSTEM_CONFIG_FILE's home (see .zshenv); oh-my-tmux supplies the
#    tmux.conf the dotfile entry below links to.
[bootstrap.repos]
"~/dev/agent" = { url = "git@github.com:oisin-ee/agent.git", ref = "main" }
"~/.local/share/tmux/oh-my-tmux" = { url = "https://github.com/gpakosz/.tmux.git" }

# ── Dotfiles. One `symlink-each` pass over the Git-tracked `home/` tree covers
#    every plain file: the target keeps unmanaged neighbours, and editing a
# deployed file edits the checkout. Templates are declared separately.
[dotfiles]
"~" = { source = "home", mode = "symlink-each", manifest = "git", exclude = [".gitconfig.tera", ".ssh/config.tera"] }

# Git identity comes from the environment or the defaults above.
"~/.gitconfig" = { source = "home/.gitconfig.tera", mode = "template" }

# Manage only this block: preserve hosts written by SSH tooling outside it.
# The template keeps UseKeychain macOS-only.
"~/.ssh/config/include" = { source = "home/.ssh/config.tera", template = "tera" }

# oh-my-tmux ships one conf; ~/.config/tmux/tmux.conf.local (tracked above) holds
# every override.
"~/.config/tmux/tmux.conf" = "~/.local/share/tmux/oh-my-tmux/.tmux.conf"

# ── Homebrew formulae, casks, and App Store apps. mise installs these into the
#    canonical Homebrew prefix without Homebrew itself, so there is no installer
#    script and no Brewfile. Portable CLIs belong in [tools] above; this list is
#    GUI apps, macOS-only utilities, and formulae with no mise backend.
# `tobi/try` is the one tap whose GitHub URL mise cannot infer: the repo is
# `tobi/try`, not `tobi/homebrew-try`. The rest follow the convention.
[bootstrap.brew.taps]
"tobi/try" = "https://github.com/tobi/try"

