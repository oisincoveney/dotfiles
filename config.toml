# ── Persistent tmux on Linux boxes. A tmux server started from an interactive SSH
#    shell lives in that login's session scope, which systemd tears down on
# disconnect. Infrastructure enables linger when it creates the account.
# The user manager must supply tmux on PATH; interactive shell activation does
# not configure the user manager environment.
[bootstrap.linux.systemd.units.tmux]
description = "Persistent tmux server"
# `new-session -d` forks the server and exits, which is what Type=forking expects.
type = "forking"
exec_start = "/usr/bin/env sh -c 'exec tmux new-session -d -s main'"
exec_stop = "/usr/bin/env sh -c 'exec tmux kill-server'"
# tmux defaults to `exit-empty on`, so killing the last session stops the server.
# Restarting keeps the base session permanently available; `systemctl --user stop
# dev.mise.tmux` remains the deliberate off switch.
restart = "always"
restart_sec = "2s"

